services:
  downloader:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
    init: true
    mem_limit: 2g
    cpus: 6
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      TRUST_PROXY: "1"
      WORKERS: "8"
      ALLOWED_ORIGIN: "https://outblade.github.io"
  # Public HTTPS address without an account: docker compose --profile public up -d
  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: [public]
    command: tunnel --no-autoupdate --url http://downloader:8080
    depends_on:
      - downloader
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
