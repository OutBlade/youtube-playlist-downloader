name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --config Release
      - run: ctest --test-dir build -C Release --output-on-failure
      - name: Package binary
        shell: python
        run: |
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          binary = Path('build/Release/ytplaylist.exe' if '${{ runner.os }}' == 'Windows' else 'build/ytplaylist')
          Path('dist').mkdir()
          with ZipFile('dist/ytplaylist-${{ runner.os }}.zip', 'w', ZIP_DEFLATED) as archive:
              for file in [binary, Path('README.md'), Path('LICENSE')]:
                  archive.write(file, file.name)
      - uses: actions/upload-artifact@v4
        with:
          name: ytplaylist-${{ matrix.os }}
          path: dist/*.zip
