name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --config Release
      - run: ctest --test-dir build -C Release --output-on-failure
      - name: Package binary
        shell: python
        run: |
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          binary = Path('build/Release/ytplaylist.exe' if '${{ runner.os }}' == 'Windows' else 'build/ytplaylist')
          server = Path('build/Release/ytplaylist-web.exe' if '${{ runner.os }}' == 'Windows' else 'build/ytplaylist-web')
          Path('dist').mkdir()
          with ZipFile('dist/ytplaylist-${{ runner.os }}.zip', 'w', ZIP_DEFLATED) as archive:
              for file in [binary, server, Path('README.md'), Path('LICENSE'), Path('THIRD_PARTY.md')]:
                  archive.write(file, file.name)
              for file in Path('web').rglob('*'):
                  if file.is_file():
                      archive.write(file, file.as_posix())
      - uses: actions/upload-artifact@v4
        with:
          name: ytplaylist-${{ matrix.os }}
          path: dist/*.zip
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ytplaylist-web:test .
      - run: docker run -d --name ytplaylist-test -p 127.0.0.1:8080:8080 ytplaylist-web:test
      - name: Verify container serves the website and has working dependencies
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/api/health > health.json; then break; fi
            sleep 2
          done
          python3 -c "import json; assert json.load(open('health.json'))['ready']"
          curl -fsS http://127.0.0.1:8080/ | grep -q 'BLADE'
      - name: Verify worker manifests with the installed yt-dlp engine
        run: |
          docker cp tests/test_engine_manifest.py ytplaylist-test:/tmp/test_engine_manifest.py
          docker exec ytplaylist-test /opt/yt-dlp/bin/python /tmp/test_engine_manifest.py
      - if: failure()
        run: docker logs ytplaylist-test
