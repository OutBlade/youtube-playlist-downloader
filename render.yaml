# 1-Click Deployment Blueprint for Render.com Free Tier (NO credit card required)
# 1. Sign up for free at https://render.com (with your GitHub account, no credit card needed).
# 2. Click New -> Blueprint -> Connect this repository.
# 3. Render builds and provisions your free HTTPS service automatically.
services:
  - type: web
    name: youtube-playlist-downloader
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 8080
      - key: ALLOWED_ORIGIN
        value: https://outblade.github.io
      - key: TRUST_PROXY
        value: "1"
      - key: WORKERS
        value: "2"
      - key: FRAGMENTS
        value: "4"
      - key: MAX_ACTIVE_JOBS
        value: "1"
      - key: QUEUE_LIMIT
        value: "50"
